# This workflow builds and publishes the package to PyPI when a GitHub
# release is published. It uses PyPI's Trusted Publishing (OIDC), so no
# API token secret is required - the "IMProToo" project on PyPI must have
# this repo/workflow registered as a trusted publisher
# (https://docs.pypi.org/trusted-publishers/).

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install IMProToo with test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
      - name: Run tests
        run: pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/IMProToo/
    permissions:
      id-token: write  # required for PyPI Trusted Publishing

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # setuptools_scm needs the full history and tags
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
